openapi: 3.0.3
info:
  title: Ecommerce REST API
  version: 1.0.0
  description: Production-grade Django 6 Ecommerce API with JWT authentication, OTP
    verification, and background email tasks.
paths:
  /api/v1/auth/google/:
    post:
      operationId: auth_google_create
      description: Exchanges Google ID token for SimpleJWT access & refresh tokens.
        Automatically creates or activates account.
      summary: Google OAuth 2.0 Login
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAuth'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticates active user with email & password, returning access
        and refresh JWT tokens.
      summary: User Login (Email & Password)
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPairRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Retrieves the current authenticated user's profile details.
      summary: Get Authenticated User Profile
      tags:
      - Authentication
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Registers a new user (inactive) and enqueues a 6-digit OTP email
        verification code.
      summary: Register User Account
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/v1/auth/resend-otp/:
    post:
      operationId: auth_resend_otp_create
      description: Resends a fresh 6-digit OTP verification code to pending user accounts.
        Rate-limited to 3 requests/minute.
      summary: Resend Verification OTP
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendOTPRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResendOTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResendOTPRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendOTP'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: Obtains a new access token using a valid refresh token.
      summary: Refresh Access Token
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/verify-otp/:
    post:
      operationId: auth_verify_otp_create
      description: Validates the 6-digit OTP code, activates user account, sends welcome
        email, and returns JWT tokens.
      summary: Verify Email with OTP
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOTP'
          description: ''
components:
  schemas:
    EmailTokenObtainPairRequest:
      type: object
      description: Custom SimpleJWT token serializer using email instead of username.
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    GoogleAuth:
      type: object
      description: Serializer for Google OAuth token exchange.
      properties:
        id_token:
          type: string
          description: Google ID token obtained from Google Sign-In on client
      required:
      - id_token
    GoogleAuthRequest:
      type: object
      description: Serializer for Google OAuth token exchange.
      properties:
        id_token:
          type: string
          minLength: 1
          description: Google ID token obtained from Google Sign-In on client
      required:
      - id_token
    Register:
      type: object
      description: Serializer for user registration.
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
      required:
      - email
      - first_name
      - last_name
    RegisterRequest:
      type: object
      description: Serializer for user registration.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        first_name:
          type: string
          minLength: 1
          maxLength: 150
        last_name:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 8
        password_confirm:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - first_name
      - last_name
      - password
      - password_confirm
    ResendOTP:
      type: object
      description: Serializer for requesting a new OTP email.
      properties:
        email:
          type: string
          format: email
      required:
      - email
    ResendOTPRequest:
      type: object
      description: Serializer for requesting a new OTP email.
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    User:
      type: object
      description: Serializer for reading user profile data.
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - email
      - first_name
      - full_name
      - id
      - is_active
      - last_name
    VerifyOTP:
      type: object
      description: Serializer for validating OTP code during account activation.
      properties:
        email:
          type: string
          format: email
        otp:
          type: string
          maxLength: 6
          minLength: 6
      required:
      - email
      - otp
    VerifyOTPRequest:
      type: object
      description: Serializer for validating OTP code during account activation.
      properties:
        email:
          type: string
          format: email
          minLength: 1
        otp:
          type: string
          minLength: 6
          maxLength: 6
      required:
      - email
      - otp
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
