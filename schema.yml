openapi: 3.0.3
info:
  title: Ecommerce REST API
  version: 1.0.0
  description: Production-grade Django 6 Ecommerce API with JWT authentication, OTP
    verification, and background email tasks.
paths:
  /api/v1/auth/google/:
    post:
      operationId: auth_google_create
      description: Exchanges Google ID token for SimpleJWT access & refresh tokens.
        Automatically creates or activates account.
      summary: Google OAuth 2.0 Login
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAuth'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticates active user with email & password, returning access
        and refresh JWT tokens.
      summary: User Login (Email & Password)
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPairRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Retrieves the current authenticated user's profile details.
      summary: Get Authenticated User Profile
      tags:
      - Authentication
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Registers a new user (inactive) and enqueues a 6-digit OTP email
        verification code.
      summary: Register User Account
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/v1/auth/resend-otp/:
    post:
      operationId: auth_resend_otp_create
      description: Resends a fresh 6-digit OTP verification code to pending user accounts.
        Rate-limited to 3 requests/minute.
      summary: Resend Verification OTP
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendOTPRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResendOTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResendOTPRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendOTP'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: Obtains a new access token using a valid refresh token.
      summary: Refresh Access Token
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/verify-otp/:
    post:
      operationId: auth_verify_otp_create
      description: Validates the 6-digit OTP code, activates user account, sends welcome
        email, and returns JWT tokens.
      summary: Verify Email with OTP
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOTP'
          description: ''
  /api/v1/cart/:
    get:
      operationId: cart_retrieve
      description: Retrieve current shopping cart for user or guest.
      tags:
      - Cart
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/v1/cart/clear/:
    delete:
      operationId: cart_clear_destroy
      description: Remove all items from shopping cart.
      tags:
      - Cart
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/v1/cart/items/:
    post:
      operationId: cart_items_create
      description: Add a product variant SKU to cart.
      tags:
      - Cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemAddUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CartItemAddUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CartItemAddUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItemAddUpdate'
          description: ''
  /api/v1/cart/items/{id}/:
    patch:
      operationId: cart_items_partial_update
      description: Update item quantity or remove item from cart.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCartItemQuantityRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCartItemQuantityRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCartItemQuantityRequest'
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    delete:
      operationId: cart_items_destroy
      description: Update item quantity or remove item from cart.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Cart
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/v1/cart/merge/:
    post:
      operationId: cart_merge_create
      description: Merge guest cart items into authenticated user cart on login.
      tags:
      - Cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartMergeRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CartMergeRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CartMergeRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/v1/cart/saved-items/:
    get:
      operationId: cart_saved_items_list
      description: List or save items for later.
      tags:
      - Saved Items
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedForLater'
          description: ''
    post:
      operationId: cart_saved_items_create
      description: List or save items for later.
      tags:
      - Saved Items
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedForLater'
          description: ''
  /api/v1/cart/saved-items/{id}/:
    delete:
      operationId: cart_saved_items_destroy
      description: Remove saved item.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Saved Items
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/catalog/admin/categories/:
    post:
      operationId: catalog_admin_categories_create
      description: Create a new root or child category (Admin only).
      tags:
      - Catalog - Admin Categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryDetailRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryDetail'
          description: ''
  /api/v1/catalog/attribute-groups/:
    get:
      operationId: catalog_attribute_groups_list
      description: List all attribute groups and their nested attributes/options.
      tags:
      - Catalog - Metadata
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttributeGroup'
          description: ''
  /api/v1/catalog/categories/:
    get:
      operationId: catalog_categories_list
      description: List root categories with their full subcategory tree.
      tags:
      - Catalog - Categories
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryTree'
          description: ''
  /api/v1/catalog/categories/{slug}/:
    get:
      operationId: catalog_categories_retrieve
      description: Get category details by slug.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Catalog - Categories
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryDetail'
          description: ''
  /api/v1/catalog/product-types/:
    get:
      operationId: catalog_product_types_list
      description: List all product types (e.g. T-Shirt, eBook, Smartphone).
      tags:
      - Catalog - Metadata
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductType'
          description: ''
  /api/v1/catalog/products/:
    get:
      operationId: catalog_products_list
      description: Public searchable & filterable product catalog.
      parameters:
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: category_id
        schema:
          type: string
          format: uuid
      - in: query
        name: is_featured
        schema:
          type: boolean
      - in: query
        name: max_price
        schema:
          type: number
      - in: query
        name: min_price
        schema:
          type: number
      - in: query
        name: min_rating
        schema:
          type: number
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: product_type
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - archived
          - draft
          - inactive
          - pending_review
        description: |-
          * `draft` - Draft
          * `pending_review` - Pending Review
          * `active` - Active
          * `inactive` - Inactive
          * `archived` - Archived
      - in: query
        name: vendor
        schema:
          type: string
      tags:
      - Catalog - Products
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductListList'
          description: ''
  /api/v1/catalog/products/{slug}/:
    get:
      operationId: catalog_products_retrieve
      description: Public detailed product view with all variants, images, and attributes.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Catalog - Products
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
          description: ''
  /api/v1/catalog/vendor/products/:
    get:
      operationId: catalog_vendor_products_list
      description: 'Vendor dashboard: List vendor''s products or create a new product.'
      parameters:
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: category_id
        schema:
          type: string
          format: uuid
      - in: query
        name: is_featured
        schema:
          type: boolean
      - in: query
        name: max_price
        schema:
          type: number
      - in: query
        name: min_price
        schema:
          type: number
      - in: query
        name: min_rating
        schema:
          type: number
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: product_type
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - archived
          - draft
          - inactive
          - pending_review
        description: |-
          * `draft` - Draft
          * `pending_review` - Pending Review
          * `active` - Active
          * `inactive` - Inactive
          * `archived` - Archived
      - in: query
        name: vendor
        schema:
          type: string
      tags:
      - Catalog - Vendor Dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductListList'
          description: ''
    post:
      operationId: catalog_vendor_products_create
      description: 'Vendor dashboard: List vendor''s products or create a new product.'
      tags:
      - Catalog - Vendor Dashboard
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductCreateUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCreateUpdate'
          description: ''
  /api/v1/catalog/vendor/products/{id}/:
    get:
      operationId: catalog_vendor_products_retrieve
      description: 'Vendor dashboard: Manage single product.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Catalog - Vendor Dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
          description: ''
    put:
      operationId: catalog_vendor_products_update
      description: 'Vendor dashboard: Manage single product.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Catalog - Vendor Dashboard
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductCreateUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCreateUpdate'
          description: ''
    patch:
      operationId: catalog_vendor_products_partial_update
      description: 'Vendor dashboard: Manage single product.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Catalog - Vendor Dashboard
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProductCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProductCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProductCreateUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCreateUpdate'
          description: ''
    delete:
      operationId: catalog_vendor_products_destroy
      description: 'Vendor dashboard: Manage single product.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Catalog - Vendor Dashboard
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/catalog/vendor/products/{product_id}/images/:
    post:
      operationId: catalog_vendor_products_images_create
      description: 'Vendor dashboard: Upload product image.'
      parameters:
      - in: path
        name: product_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Catalog - Vendor Dashboard
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductImageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductImageRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductImageRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductImage'
          description: ''
  /api/v1/catalog/vendor/products/{product_id}/variants/:
    post:
      operationId: catalog_vendor_products_variants_create
      description: 'Vendor dashboard: Add a variant SKU to an existing product.'
      parameters:
      - in: path
        name: product_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Catalog - Vendor Dashboard
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductVariantCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductVariantCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductVariantCreateUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductVariantCreateUpdate'
          description: ''
  /api/v1/catalog/vendor/variants/{id}/:
    get:
      operationId: catalog_vendor_variants_retrieve
      description: 'Vendor dashboard: Update or delete a variant SKU.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Catalog - Vendor Dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductVariantCreateUpdate'
          description: ''
    put:
      operationId: catalog_vendor_variants_update
      description: 'Vendor dashboard: Update or delete a variant SKU.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Catalog - Vendor Dashboard
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductVariantCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductVariantCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductVariantCreateUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductVariantCreateUpdate'
          description: ''
    patch:
      operationId: catalog_vendor_variants_partial_update
      description: 'Vendor dashboard: Update or delete a variant SKU.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Catalog - Vendor Dashboard
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProductVariantCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProductVariantCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProductVariantCreateUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductVariantCreateUpdate'
          description: ''
    delete:
      operationId: catalog_vendor_variants_destroy
      description: 'Vendor dashboard: Update or delete a variant SKU.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Catalog - Vendor Dashboard
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/inventory/admin/warehouses/:
    get:
      operationId: inventory_admin_warehouses_list
      description: Manage fulfillment warehouses (Admin only).
      tags:
      - Inventory - Admin Warehouses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Warehouse'
          description: ''
