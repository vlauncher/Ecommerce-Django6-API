name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Django Tests & Schema Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_ecommerce_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Run System Check
        env:
          DJANGO_SECRET_KEY: ci-secret-key-test
          DJANGO_DEBUG: "True"
          DJANGO_SETTINGS_MODULE: core.settings.dev
        run: |
          python manage.py check

      - name: Run Django Test Suite
        env:
          DJANGO_SECRET_KEY: ci-secret-key-test
          DJANGO_DEBUG: "True"
          DJANGO_SETTINGS_MODULE: core.settings.dev
        run: |
          python manage.py test vendors catalog reviews accounts cart orders payments inventory promotions search notifications

      - name: Validate OpenAPI Schema Specification
        env:
          DJANGO_SECRET_KEY: ci-secret-key-test
          DJANGO_DEBUG: "True"
          DJANGO_SETTINGS_MODULE: core.settings.dev
        run: |
          python manage.py spectacular --validate --file schema.yml

  docker-build:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ecommerce-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
