<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-950 to-slate-900 min-h-screen text-slate-100 font-sans leading-relaxed">
    <div class="max-w-lg mx-auto py-12 px-4">
        <!-- Logo / Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-violet-400 via-fuchsia-400 to-cyan-400 bg-clip-text text-transparent">
                {{ app_name }}
            </h1>
        </div>

        <!-- Card -->
        <div class="bg-slate-800/80 backdrop-blur-xl border border-slate-700/60 rounded-2xl shadow-2xl p-8">
            {% block content %}{% endblock %}
        </div>

        <!-- Footer -->
        <div class="text-center mt-8 text-xs text-slate-500 space-y-1">
            <p>&copy; {{ year }} {{ app_name }}. All rights reserved.</p>
            <p>You received this email because you signed up on our platform.</p>
        </div>
    </div>
</body>
</html>
